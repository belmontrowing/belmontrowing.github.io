<!doctype html>
<!--
  Side-by-side preview: the rendered site (docs/) as a laptop and a phone at once.
  NOT part of the website (folders starting with "_" are never published).

  Start it from the project folder:
      python3 -m http.server 8765
  then open  http://localhost:8765/_tools/side-by-side.html
  After a "quarto render", press Reload in the toolbar.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BRC side-by-side preview</title>
<style>
  :root { --navy: #0A1F3C; --paper: #F6F7F4; --green: #80C040; --blue: #00B0F0; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #DDE2E8; font: 14px/1.4 -apple-system, system-ui, sans-serif; color: var(--navy); }
  header { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; padding: .6rem 1rem;
           background: var(--navy); color: #fff; position: sticky; top: 0; z-index: 2; }
  header strong { margin-right: .75rem; letter-spacing: .03em; }
  header button { font: inherit; padding: .35rem .8rem; border-radius: 6px; border: 1px solid var(--blue);
                  background: transparent; color: #fff; cursor: pointer; }
  header button[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: var(--navy); font-weight: 600; }
  header .spacer { flex: 1; }
  main { display: flex; gap: 1.5rem; align-items: flex-start; padding: 1rem; }
  figure { margin: 0; }
  figcaption { font-weight: 600; margin-bottom: .4rem; }
  .desktop { flex: 1; min-width: 0; }
  .screen { background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 18px rgba(10,31,60,.18); position: relative; }
  .screen iframe { border: 0; display: block; transform-origin: 0 0; background: #fff; }
  .phone .screen { width: 390px; height: 844px; border: 10px solid #111; border-radius: 36px; }
  .phone iframe { width: 370px; height: 824px; }
</style>
</head>
<body>
<header>
  <strong>BRC preview</strong>
  <span id="pages"></span>
  <span class="spacer"></span>
  <button id="reload" type="button">Reload</button>
</header>
<main>
  <figure class="desktop">
    <figcaption>Laptop (1440px wide, shown smaller)</figcaption>
    <div class="screen" id="desk-screen"><iframe id="desk" title="Laptop view" width="1440" height="900"></iframe></div>
  </figure>
  <figure class="phone">
    <figcaption>Phone (390px wide)</figcaption>
    <div class="screen"><iframe id="phone" title="Phone view"></iframe></div>
  </figure>
</main>
<script>
  // Pages of the site (in docs/). Add a line here if a new page is added.
  const pages = { Home: "", About: "about/", Youth: "youth/", Adult: "adult/", Other: "other/", Contact: "contact/" };
  const desk = document.getElementById("desk"), phone = document.getElementById("phone");
  const deskScreen = document.getElementById("desk-screen");
  let current = location.hash.slice(1) || "Home";

  function show(name) {
    current = name;
    location.hash = name;
    const url = "../docs/" + pages[name] + "index.html?t=" + Date.now();   // ?t= skips the browser cache
    desk.src = url; phone.src = url;
    document.querySelectorAll("#pages button").forEach(b => b.setAttribute("aria-pressed", b.textContent === name));
  }
  function fit() {   // shrink the 1440px laptop view to the space available
    const s = deskScreen.parentElement.clientWidth / 1440;
    desk.style.transform = "scale(" + s + ")";
    deskScreen.style.height = (900 * s) + "px";
  }
  for (const name in pages) {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = name; b.onclick = () => show(name);
    document.getElementById("pages").append(b, " ");
  }
  document.getElementById("reload").onclick = () => show(current);
  window.addEventListener("resize", fit);
  fit(); show(pages[current] !== undefined ? current : "Home");
</script>
</body>
</html>
